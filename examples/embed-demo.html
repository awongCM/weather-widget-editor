<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Weather Widget Embed Demo</title>
  </head>
  <body>
    <h1>Embed demo</h1>
    <p>Paste your generated snippet below, or use a preconfigured example after starting the server.</p>

    <!-- Example: replace lat/lon with your coordinates -->
    <script
      id="weather-widget-loader"
      src="http://127.0.0.1:9090/embed/widget.js"
      data-title="Demo Widget"
      data-units="metric"
      data-show-wind="true"
      data-lat="-33.87"
      data-lon="151.21"
    ></script>
    <div id="weather-widget-content"></div>
  </body>
</html>
